services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      # host:container — point your reverse proxy at host port 8080.
      - "8080:80"
    environment:
      # Public repo → HTTPS clone needs no credentials. For a private repo,
      # use a token URL, e.g. https://<user>:<token>@github.com/you/repo.git
      REPO_URL: "https://github.com/ggardenhire/portfolio.git"
      REPO_BRANCH: "main"
      POLL_INTERVAL: "300" # seconds between update checks
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
